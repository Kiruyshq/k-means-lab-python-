[project]
name = "kmeans-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
kmeans = "kmeans.cli:main"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kmeans"]